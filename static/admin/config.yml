backend:
  name: github
  repo: j-street-photo/jphoto
  branch: main
  base_url: https://jphoto-auth.jeremy06.workers.dev
  auth_endpoint: /auth

media_folder: "content/photos/uncategorised"
public_folder: "/photos/uncategorised"

collections:
  - name: "uncategorised"
    label: "Uncategorised"
    label_singular: "Photo"
    folder: "content/photos/uncategorised"
    create: true
    fields:
      - label: "Photo"
        name: "image"
        widget: "image"
        media_folder: "/content/photos/uncategorised"
        public_folder: ""
      - label: "Caption"
        name: "title"
        widget: "string"
        required: false
        hint: "Optional caption shown in the lightbox"
      - label: "Date"
        name: "date"
        widget: "datetime"
        default: ""