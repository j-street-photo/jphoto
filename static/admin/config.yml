backend:
  name: github
  repo: j-street-photo/jphoto
  branch: main
  base_url: https://jphoto-auth.jeremy06.workers.dev
  auth_endpoint: /auth

media_folder: "static/images"
public_folder: "/images"

collections:
- name: "galleries"
    label: "Galleries"
    label_singular: "Gallery"
    folder: "content/photos"
    create: true
    fields:
      - label: "Gallery Name"
        name: "title"
        widget: "string"
      - label: "Date"
        name: "date"
        widget: "datetime"
        default: ""
      - label: "Description"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Optional text shown at the top of this gallery"

  - name: "photos"
    label: "Photos"
    label_singular: "Photo"
    folder: "content/photos"
    path: "{{dirname}}/{{slug}}"
    create: true
    nested:
      depth: 2
    fields:
      - label: "Gallery"
        name: "gallery"
        widget: "string"
        hint: "Must match an existing gallery folder name exactly (e.g. uncategorised, street-2024)"
      - label: "Photo"
        name: "image"
        widget: "image"
      - label: "Caption"
        name: "title"
        widget: "string"
        required: false
        hint: "Optional caption shown in the lightbox"
      - label: "Date"
        name: "date"
        widget: "datetime"
        default: ""